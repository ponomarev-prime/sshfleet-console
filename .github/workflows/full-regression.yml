name: Full regression

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 0"

permissions:
  contents: read

concurrency:
  group: full-regression
  cancel-in-progress: false

jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: recursive
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Install companion build prerequisites
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake ninja-build gettext pkg-config autoconf automake libtool unzip zsh fish
      - name: Run full regression
        env:
          SSHF_REGRESSION_ARTIFACT_DIR: ${{ github.workspace }}/.artifacts/regression
        run: make regression
      - name: Archive regression evidence
        if: always()
        run: tar -C .artifacts -czf full-regression-evidence.tar.gz regression
      - name: Upload regression evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: full-regression-evidence.tar.gz
          archive: false
          if-no-files-found: error
          retention-days: 30
